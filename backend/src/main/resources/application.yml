server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: skill-hub-backend
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  datasource:
    url: jdbc:sqlite:${user.dir}/data/skillhub.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never

skillhub:
  demo-data:
    enabled: ${SKILLHUB_DEMO_DATA:true}
  seed-community:
    enabled: ${SKILLHUB_SEED_COMMUNITY:true}
  seniors-dir: ${user.dir}/data/seniors
  allow-zip-upload: true
  llm:
    provider: ${LLM_PROVIDER:mock}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
    fallback-to-mock: ${LLM_FALLBACK_TO_MOCK:false}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:8192}
